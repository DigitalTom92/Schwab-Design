<!DOCTYPE html>

<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Schwab Design</title>


    <style>

        /* =========================
           GRUNDLAGEN
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {

            scroll-behavior: auto;

            overflow: hidden;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #1d1d1f;

            background: #fff;

            overflow: hidden;
        }


        :root {

            --schwab-yellow: #d6b300;

            --dark-text: #1d1d1f;
        }



        /* =========================
           NAVIGATION
           APPLE GLOSSY / GLASS
        ========================= */

        nav {

            height: 60px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

            position: fixed;

            top: 0;

            left: 0;

            right: 0;


            /*
             * Transparenter Glas-Look
             */

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.90) 0%,
                    rgba(255,255,255,0.72) 45%,
                    rgba(245,245,247,0.62) 100%
                );


            /*
             * Apple-ähnlicher Blur
             */

            backdrop-filter:
                blur(24px)
                saturate(180%);

            -webkit-backdrop-filter:
                blur(24px)
                saturate(180%);


            /*
             * Feiner Glasrand
             */

            border-bottom:
                1px solid
                rgba(255,255,255,0.75);


            /*
             * Dezenter Schatten
             */

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.07),

                0 2px 8px
                rgba(0,0,0,0.035),

                inset 0 1px 0
                rgba(255,255,255,0.95);


            z-index: 100;

            overflow: hidden;
        }



        /* =========================
           GLOSSY LICHTREFLEX
        ========================= */

        nav::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 45%;


            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.55),
                    rgba(255,255,255,0)
                );


            pointer-events: none;

            z-index: 0;
        }



        /* =========================
           LOGO
        ========================= */

        .logo {

            position: relative;

            z-index: 1;

            font-size: 21px;

            font-weight: 600;

            letter-spacing: -0.6px;

            text-decoration: none;

            color: var(--dark-text);

            cursor: pointer;


            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .logo:hover {

            opacity: 0.75;

            transform:
                scale(0.98);
        }


        .logo .schwab {

            color:
                var(--schwab-yellow);
        }


        .logo .design {

            color:
                var(--dark-text);
        }



        /* =========================
           NAV LINKS
        ========================= */

        nav .nav-links {

            position: relative;

            z-index: 1;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        nav .nav-links a {

            position: relative;

            color:
                rgba(29,29,31,0.82);

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;

            margin-left: 22px;

            padding:
                8px 13px;

            border-radius: 10px;

            cursor: pointer;


            transition:
                color 0.25s ease,
                background 0.25s ease,
                transform 0.2s ease;
        }


        /*
         * Hover-Effekt
         */

        nav .nav-links a:hover {

            color:
                #000;

            background:
                rgba(255,255,255,0.55);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.8);

            transform:
                translateY(-1px);
        }


        /*
         * Klick-Effekt
         */

        nav .nav-links a:active {

            transform:
                scale(0.96);
        }



        /* =========================
           FULL PAGE CONTAINER
        ========================= */

        .page-container {

            width: 100vw;

            height: 100vh;

            height: 100dvh;

            overflow: hidden;

            position: relative;
        }



        /* =========================
           EINZELNE SEITE
        ========================= */

        .page {

            width: 100vw;

            height: 100vh;

            height: 100dvh;

            min-height: 100vh;

            min-height: 100dvh;

            position: absolute;

            top: 0;

            left: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            opacity: 0;

            pointer-events: none;

            transform:
                translate3d(0, 100%, 0);


            transition:

                transform 0.9s
                cubic-bezier(
                    0.77,
                    0,
                    0.175,
                    1
                ),

                opacity 0.6s ease;
        }



        /* =========================
           AKTUELLE SEITE
        ========================= */

        .page.active {

            opacity: 1;

            pointer-events: auto;

            transform:
                translate3d(0, 0, 0);

            z-index: 2;
        }



        /* =========================
           VORHERIGE SEITE
        ========================= */

        .page.previous {

            opacity: 0;

            transform:
                translate3d(0, -100%, 0);

            z-index: 1;
        }



        /* =========================
           NÄCHSTE SEITE
        ========================= */

        .page.next {

            opacity: 0;

            transform:
                translate3d(0, 100%, 0);

            z-index: 1;
        }

           STARTSEITE
        ========================= */

            background: #fff;

            text-align: center;

            padding:
                80px 6% 50px;
        }

            width: 100%;

            max-width: 1200px;

            will-change:
                transform,
                opacity;
        }
